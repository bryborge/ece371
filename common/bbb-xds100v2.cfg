# BeagleBone Black (AM3359) through a TI XDS100v2, for the ECE 371 labs.
#
# Does what CCS does on connect with TI's beagleboneblack.gel v1.5
# (ccs_base/emulation/boards/beaglebone/gel/): halt, disable the watchdog,
# lock the PLLs at OPP100 and bring up DDR3 at 400 MHz, so GDB can `load`
# programs at 0x80000000. Register names, offsets and values are copied
# from that GEL; the PRCM, Control Module and EMIF chapters of the AM335x
# TRM (SPRUH73) describe the fields.
#
# Standalone:  openocd -f common/xds100v2-clear-power-loss.cfg
#              openocd -f common/bbb-xds100v2.cfg
# then GDB:    target extended-remote :3333, monitor bbb_init, load

source [find interface/ftdi/xds100v2.cfg]
source [find board/ti_beaglebone_black.cfg]

# am335x.cfg creates the Cortex-M3 wakeup core first, so it would take the
# first GDB port; the labs only debug the Cortex-A8.
$_TARGETNAME_2 configure -gdb-port disabled

set PRCM_BASE_ADDR             0x44E00000
set CM_PER_EMIF_CLKCTRL        [expr {$PRCM_BASE_ADDR + 0x028}]
set CM_IDLEST_DPLL_MPU         [expr {$PRCM_BASE_ADDR + 0x420}]
set CM_CLKSEL_DPLL_MPU         [expr {$PRCM_BASE_ADDR + 0x42C}]
set CM_IDLEST_DPLL_DDR         [expr {$PRCM_BASE_ADDR + 0x434}]
set CM_CLKSEL_DPLL_DDR         [expr {$PRCM_BASE_ADDR + 0x440}]
set CM_IDLEST_DPLL_DISP        [expr {$PRCM_BASE_ADDR + 0x448}]
set CM_CLKSEL_DPLL_DISP        [expr {$PRCM_BASE_ADDR + 0x454}]
set CM_IDLEST_DPLL_CORE        [expr {$PRCM_BASE_ADDR + 0x45C}]
set CM_CLKSEL_DPLL_CORE        [expr {$PRCM_BASE_ADDR + 0x468}]
set CM_IDLEST_DPLL_PER         [expr {$PRCM_BASE_ADDR + 0x470}]
set CM_CLKSEL_DPLL_PER         [expr {$PRCM_BASE_ADDR + 0x49C}]
set CM_DIV_M4_DPLL_CORE        [expr {$PRCM_BASE_ADDR + 0x480}]
set CM_DIV_M5_DPLL_CORE        [expr {$PRCM_BASE_ADDR + 0x484}]
set CM_CLKMODE_DPLL_MPU        [expr {$PRCM_BASE_ADDR + 0x488}]
set CM_CLKMODE_DPLL_PER        [expr {$PRCM_BASE_ADDR + 0x48C}]
set CM_CLKMODE_DPLL_CORE       [expr {$PRCM_BASE_ADDR + 0x490}]
set CM_CLKMODE_DPLL_DDR        [expr {$PRCM_BASE_ADDR + 0x494}]
set CM_CLKMODE_DPLL_DISP       [expr {$PRCM_BASE_ADDR + 0x498}]
set CM_DIV_M2_DPLL_DDR         [expr {$PRCM_BASE_ADDR + 0x4A0}]
set CM_DIV_M2_DPLL_DISP        [expr {$PRCM_BASE_ADDR + 0x4A4}]
set CM_DIV_M2_DPLL_MPU         [expr {$PRCM_BASE_ADDR + 0x4A8}]
set CM_DIV_M2_DPLL_PER         [expr {$PRCM_BASE_ADDR + 0x4AC}]
set CM_DIV_M6_DPLL_CORE        [expr {$PRCM_BASE_ADDR + 0x4D8}]

set CONTROL_BASE_ADDR          0x44E10000
set CONTROL_STATUS             [expr {$CONTROL_BASE_ADDR + 0x040}]
set DDR_IO_CTRL                [expr {$CONTROL_BASE_ADDR + 0xE04}]
set VTP_CTRL_REG               [expr {$CONTROL_BASE_ADDR + 0xE0C}]
set DDR_CKE_CTRL               [expr {$CONTROL_BASE_ADDR + 0x131C}]
set DDR_CMD0_IOCTRL            [expr {$CONTROL_BASE_ADDR + 0x1404}]
set DDR_CMD1_IOCTRL            [expr {$CONTROL_BASE_ADDR + 0x1408}]
set DDR_CMD2_IOCTRL            [expr {$CONTROL_BASE_ADDR + 0x140C}]
set DDR_DATA0_IOCTRL           [expr {$CONTROL_BASE_ADDR + 0x1440}]
set DDR_DATA1_IOCTRL           [expr {$CONTROL_BASE_ADDR + 0x1444}]

set EMIF_BASE_ADDR             0x4C000000
set EMIF_STATUS_REG            [expr {$EMIF_BASE_ADDR + 0x004}]
set EMIF_SDRAM_CONFIG_REG      [expr {$EMIF_BASE_ADDR + 0x008}]
set EMIF_SDRAM_REF_CTRL_REG    [expr {$EMIF_BASE_ADDR + 0x010}]
set EMIF_SDRAM_REF_CTRL_SHDW_REG [expr {$EMIF_BASE_ADDR + 0x014}]
set EMIF_SDRAM_TIM_1_REG       [expr {$EMIF_BASE_ADDR + 0x018}]
set EMIF_SDRAM_TIM_1_SHDW_REG  [expr {$EMIF_BASE_ADDR + 0x01C}]
set EMIF_SDRAM_TIM_2_REG       [expr {$EMIF_BASE_ADDR + 0x020}]
set EMIF_SDRAM_TIM_2_SHDW_REG  [expr {$EMIF_BASE_ADDR + 0x024}]
set EMIF_SDRAM_TIM_3_REG       [expr {$EMIF_BASE_ADDR + 0x028}]
set EMIF_SDRAM_TIM_3_SHDW_REG  [expr {$EMIF_BASE_ADDR + 0x02C}]
set EMIF_ZQ_CONFIG_REG         [expr {$EMIF_BASE_ADDR + 0x0C8}]
set EMIF_DDR_PHY_CTRL_1_REG    [expr {$EMIF_BASE_ADDR + 0x0E4}]
set EMIF_DDR_PHY_CTRL_1_SHDW_REG [expr {$EMIF_BASE_ADDR + 0x0E8}]
set EMIF_DDR_PHY_CTRL_2_REG    [expr {$EMIF_BASE_ADDR + 0x0EC}]

set DDR_PHY_BASE_ADDR          0x44E12000
set CMD0_REG_PHY_CTRL_SLAVE_RATIO_0   [expr {$DDR_PHY_BASE_ADDR + 0x01C}]
set CMD0_REG_PHY_INVERT_CLKOUT_0      [expr {$DDR_PHY_BASE_ADDR + 0x02C}]
set DATA0_REG_PHY_RD_DQS_SLAVE_RATIO_0  [expr {$DDR_PHY_BASE_ADDR + 0x0C8}]
set DATA0_REG_PHY_WR_DQS_SLAVE_RATIO_0  [expr {$DDR_PHY_BASE_ADDR + 0x0DC}]
set DATA0_REG_PHY_FIFO_WE_SLAVE_RATIO_0 [expr {$DDR_PHY_BASE_ADDR + 0x108}]
set DATA0_REG_PHY_WR_DATA_SLAVE_RATIO_0 [expr {$DDR_PHY_BASE_ADDR + 0x120}]

# The GEL spins forever on these status bits; time out with a message
# instead, so a PLL or PHY that never comes up cannot hang the session.
proc bbb_wait {what addr mask value} {
	for {set i 0} {$i < 1000} {incr i} {
		if {([mrw $addr] & $mask) == $value} {
			return
		}
	}
	error "bbb_init: timed out waiting for $what (register [format 0x%08X $addr])"
}

# Each DPLL is relocked the same way: MN-bypass it (CLKMODE.EN = 4), set
# M and N in CLKSEL and the output dividers, then lock it (CLKMODE.EN = 7).

proc bbb_mpu_pll {n m m2} {
	global CM_CLKMODE_DPLL_MPU CM_IDLEST_DPLL_MPU CM_CLKSEL_DPLL_MPU CM_DIV_M2_DPLL_MPU
	set clkmode [mrw $CM_CLKMODE_DPLL_MPU]
	mww $CM_CLKMODE_DPLL_MPU 0x4
	bbb_wait "MPU DPLL bypass" $CM_IDLEST_DPLL_MPU 0x101 0x100
	mmw $CM_CLKSEL_DPLL_MPU [expr {($m << 8) | $n}] 0x7FFFF
	mmw $CM_DIV_M2_DPLL_MPU $m2 0x1F
	mww $CM_CLKMODE_DPLL_MPU [expr {$clkmode | 0x7}]
	bbb_wait "MPU DPLL lock" $CM_IDLEST_DPLL_MPU 0x101 0x1
}

proc bbb_core_pll {n m m4 m5 m6} {
	global CM_CLKMODE_DPLL_CORE CM_IDLEST_DPLL_CORE CM_CLKSEL_DPLL_CORE
	global CM_DIV_M4_DPLL_CORE CM_DIV_M5_DPLL_CORE CM_DIV_M6_DPLL_CORE
	mmw $CM_CLKMODE_DPLL_CORE 0x4 0x7
	bbb_wait "Core DPLL bypass" $CM_IDLEST_DPLL_CORE 0x100 0x100
	mmw $CM_CLKSEL_DPLL_CORE [expr {($m << 8) | $n}] 0x7FFFF
	mww $CM_DIV_M4_DPLL_CORE $m4
	mww $CM_DIV_M5_DPLL_CORE $m5
	mww $CM_DIV_M6_DPLL_CORE $m6
	mmw $CM_CLKMODE_DPLL_CORE 0x7 0x7
	bbb_wait "Core DPLL lock" $CM_IDLEST_DPLL_CORE 0x1 0x1
}

proc bbb_ddr_pll {n m m2} {
	global CM_CLKMODE_DPLL_DDR CM_IDLEST_DPLL_DDR CM_CLKSEL_DPLL_DDR CM_DIV_M2_DPLL_DDR
	mmw $CM_CLKMODE_DPLL_DDR 0x4 0x7
	bbb_wait "DDR DPLL bypass" $CM_IDLEST_DPLL_DDR 0x100 0x100
	mmw $CM_CLKSEL_DPLL_DDR [expr {($m << 8) | $n}] 0x7FFFF
	mmw $CM_DIV_M2_DPLL_DDR $m2 0x1F
	mmw $CM_CLKMODE_DPLL_DDR 0x7 0x7
	bbb_wait "DDR DPLL lock" $CM_IDLEST_DPLL_DDR 0x1 0x1
}

proc bbb_per_pll {n m m2} {
	global CM_CLKMODE_DPLL_PER CM_IDLEST_DPLL_PER CM_CLKSEL_DPLL_PER CM_DIV_M2_DPLL_PER
	mmw $CM_CLKMODE_DPLL_PER 0x4 0x7
	bbb_wait "PER DPLL bypass" $CM_IDLEST_DPLL_PER 0x100 0x100
	# SD divider (bits 31:24) = 4, as the GEL sets for OPP100 and OPP50.
	mmw $CM_CLKSEL_DPLL_PER [expr {0x04000000 | ($m << 8) | $n}] 0xFF0FFFFF
	mww $CM_DIV_M2_DPLL_PER [expr {0xFFFFFF80 | $m2}]
	mmw $CM_CLKMODE_DPLL_PER 0x7 0x7
	bbb_wait "PER DPLL lock" $CM_IDLEST_DPLL_PER 0x1 0x1
}

proc bbb_disp_pll {n m m2} {
	global CM_CLKMODE_DPLL_DISP CM_IDLEST_DPLL_DISP CM_CLKSEL_DPLL_DISP CM_DIV_M2_DPLL_DISP
	mmw $CM_CLKMODE_DPLL_DISP 0x4 0x7
	bbb_wait "DISP DPLL bypass" $CM_IDLEST_DPLL_DISP 0x100 0x100
	mmw $CM_CLKSEL_DPLL_DISP [expr {($m << 8) | $n}] 0x7FFFF
	mww $CM_DIV_M2_DPLL_DISP [expr {0xFFFFFFE0 | $m2}]
	mmw $CM_CLKMODE_DPLL_DISP 0x7 0x7
	bbb_wait "DISP DPLL lock" $CM_IDLEST_DPLL_DISP 0x1 0x1
}

# GEL ARM_OPP100_Config(). The M/N values assume the BBB's 24 MHz crystal;
# the GEL prints a warning and carries on otherwise, but nothing after
# this would work, so stop here.
proc bbb_opp100 {} {
	global CONTROL_STATUS
	set sysboot_clk [expr {([mrw $CONTROL_STATUS] >> 22) & 0x3}]
	if {$sysboot_clk != 1} {
		error "bbb_init: SYSBOOT\[15:14\] = $sysboot_clk, expected 1 (24 MHz input clock)"
	}
	bbb_mpu_pll  0 25 1        ;# 600 MHz
	bbb_core_pll 2 125 10 8 4
	bbb_ddr_pll  2 50 1        ;# 400 MHz
	bbb_per_pll  9 400 5
	bbb_disp_pll 0 2 1
	echo "bbb_init: PLLs locked at OPP100"
}

# GEL DDR3_EMIF_Config(): DDR3 at 400 MHz.
proc bbb_ddr3_init {} {
	global CM_PER_EMIF_CLKCTRL VTP_CTRL_REG DDR_IO_CTRL DDR_CKE_CTRL
	global DDR_CMD0_IOCTRL DDR_CMD1_IOCTRL DDR_CMD2_IOCTRL DDR_DATA0_IOCTRL DDR_DATA1_IOCTRL
	global CMD0_REG_PHY_CTRL_SLAVE_RATIO_0 CMD0_REG_PHY_INVERT_CLKOUT_0
	global DATA0_REG_PHY_RD_DQS_SLAVE_RATIO_0 DATA0_REG_PHY_WR_DQS_SLAVE_RATIO_0
	global DATA0_REG_PHY_FIFO_WE_SLAVE_RATIO_0 DATA0_REG_PHY_WR_DATA_SLAVE_RATIO_0
	global EMIF_STATUS_REG EMIF_SDRAM_CONFIG_REG EMIF_ZQ_CONFIG_REG
	global EMIF_SDRAM_REF_CTRL_REG EMIF_SDRAM_REF_CTRL_SHDW_REG
	global EMIF_SDRAM_TIM_1_REG EMIF_SDRAM_TIM_1_SHDW_REG
	global EMIF_SDRAM_TIM_2_REG EMIF_SDRAM_TIM_2_SHDW_REG
	global EMIF_SDRAM_TIM_3_REG EMIF_SDRAM_TIM_3_SHDW_REG
	global EMIF_DDR_PHY_CTRL_1_REG EMIF_DDR_PHY_CTRL_1_SHDW_REG EMIF_DDR_PHY_CTRL_2_REG

	mww $CM_PER_EMIF_CLKCTRL 0x2
	bbb_wait "EMIF clock" $CM_PER_EMIF_CLKCTRL 0xFFFFFFFF 0x2

	# VTP calibration of the DDR I/O impedance: filter = 3, enable, pulse CLRZ.
	mww $VTP_CTRL_REG 0x0
	mww $VTP_CTRL_REG 0x6
	mmw $VTP_CTRL_REG 0x40 0x0
	mmw $VTP_CTRL_REG 0x0 0x1
	mmw $VTP_CTRL_REG 0x1 0x0
	bbb_wait "VTP ready" $VTP_CTRL_REG 0x20 0x20

	# PHY command macros CMD0-2 sit 0x34 apart, data macros DATA0-1 0xA4 apart.
	foreach i {0 1 2} {
		mww [expr {$CMD0_REG_PHY_CTRL_SLAVE_RATIO_0 + $i * 0x34}] 0x80
		mww [expr {$CMD0_REG_PHY_INVERT_CLKOUT_0 + $i * 0x34}] 0x0
	}
	foreach i {0 1} {
		mww [expr {$DATA0_REG_PHY_RD_DQS_SLAVE_RATIO_0 + $i * 0xA4}] 0x38
		mww [expr {$DATA0_REG_PHY_WR_DQS_SLAVE_RATIO_0 + $i * 0xA4}] 0x44
		mww [expr {$DATA0_REG_PHY_FIFO_WE_SLAVE_RATIO_0 + $i * 0xA4}] 0x94
		mww [expr {$DATA0_REG_PHY_WR_DATA_SLAVE_RATIO_0 + $i * 0xA4}] 0x7D
	}

	foreach reg [list $DDR_CMD0_IOCTRL $DDR_CMD1_IOCTRL $DDR_CMD2_IOCTRL \
			$DDR_DATA0_IOCTRL $DDR_DATA1_IOCTRL] {
		mww $reg 0x18B
	}
	# Clear DDR_IO_CTRL bit 28 for DDR3 I/O; hand CKE to the EMIF.
	mmw $DDR_IO_CTRL 0x0 0x10000000
	mmw $DDR_CKE_CTRL 0x1 0x0

	# Read latency = CL + 2 - 1 = 7 (CL = 6 at tCK = 2.5 ns).
	mww $EMIF_DDR_PHY_CTRL_1_REG 0x07
	mww $EMIF_DDR_PHY_CTRL_1_SHDW_REG 0x07
	mww $EMIF_DDR_PHY_CTRL_2_REG 0x07
	mww $EMIF_SDRAM_TIM_1_REG 0x0AAAD4DB
	mww $EMIF_SDRAM_TIM_1_SHDW_REG 0x0AAAD4DB
	mww $EMIF_SDRAM_TIM_2_REG 0x266B7FDA
	mww $EMIF_SDRAM_TIM_2_SHDW_REG 0x266B7FDA
	mww $EMIF_SDRAM_TIM_3_REG 0x501F867F
	mww $EMIF_SDRAM_TIM_3_SHDW_REG 0x501F867F
	# 400 MHz x 7.8 us refresh interval = 0xC30 cycles.
	mww $EMIF_SDRAM_REF_CTRL_REG 0x00000C30
	mww $EMIF_SDRAM_REF_CTRL_SHDW_REG 0x00000C30
	mww $EMIF_ZQ_CONFIG_REG 0x50074BE4
	# Written last: this starts the SDRAM init sequence.
	mww $EMIF_SDRAM_CONFIG_REG 0x61C05332

	# The GEL only reports this bit; a PHY that is not ready means DDR loads
	# will fail, so treat it as an error.
	bbb_wait "DDR PHY ready" $EMIF_STATUS_REG 0x4 0x4
	echo "bbb_init: DDR3 up at 0x80000000"
}

# GEL AM335xStartState(): ARM state, Supervisor mode, MMU off, so a load
# writes physical addresses and execution starts in the mode main.S expects.
proc bbb_start_state {} {
	set cpsr [lindex [regexp -inline {0x[0-9a-fA-F]+} [reg cpsr]] 0]
	reg cpsr [format 0x%08X [expr {($cpsr & ~0x3F) | 0x13}]]
	set sctlr [arm mrc 15 0 1 0 0]
	arm mcr 15 0 1 0 0 [expr {$sctlr & ~0x1}]
}

# GEL OnTargetConnect(), minus the memory map, which only CCS uses, and
# minus its "System Reset": through this probe, board/ti_beaglebone_black's
# TRST+SRST reset takes the A8's debug logic down with the core, so the halt
# after it times out. Run this from a fresh S2 boot (ROM idling) or over a
# previous session's program; it does not need the reset.
proc bbb_init {} {
	halt
	disable_watchdog
	bbb_opp100
	bbb_ddr3_init
	bbb_start_state
}
