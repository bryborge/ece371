# Clears the XDS100v2's power-loss flag and exits. Run it before
# bbb-xds100v2.cfg every session.
#
# The probe's CPLD sets the flag whenever the target loses power, and while
# it is set every JTAG pin is high-Z; only a rising edge on PWR_RST clears
# it (interface/ftdi/xds100v2.cfg). bbb-xds100v2.cfg needs the flag clear
# before its first scan: if that scan fails, OpenOCD skips the ICEPick setup
# that enables the A8's TAP, so the DAP is never initialized, and enabling
# the TAP later examines the A8 through it and aborts OpenOCD.
#
#   openocd -f common/xds100v2-clear-power-loss.cfg

source [find interface/ftdi/xds100v2.cfg]
transport select jtag
adapter speed 1000

# No TAPs are declared, so init only autoprobes the chain; with the flag set
# that probe reads all ones, which is expected here and harmless.
init
ftdi set_signal PWR_RST 1
shutdown
